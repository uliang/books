[project]
name = "books"
version = "0.1.0"
description = "Self service accounting application with MCP and web interfaces"
readme = "README.md"
authors = [{ name = "Tang U-Liang", email = "uliang6482@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "sqlalchemy>=2.0.36",
]

[project.scripts]
books = "books:main"
books-web = "books.interfaces.web.app:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "djlint>=1.36.4",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-timeout>=2.3.1",
    "import-linter>=2.1",
    "ruff>=0.15.13",
]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --timeout=30"

# Enforced context boundaries (ADR-0013). Boundary violations fail the gate.
# Run: `uv run lint-imports`. Table ownership stays a runtime-SQL convention
# (not importable), contained to the single Reporting carve-out.
[tool.importlinter]
root_package = "books"

# platform/ is plumbing only — NO domain concepts. It must never depend on a
# bounded context (ADR-0013 "platform/ is plumbing only").
[[tool.importlinter.contracts]]
name = "platform is technical infra only (no domain dependencies)"
type = "forbidden"
source_modules = ["books.platform"]
forbidden_modules = [
    "books.party",
    "books.invoicing",
    "books.expense_management",
    "books.general_ledger",
    "books.bank_reconciliation",
    "books.reporting",
]

# Each context is private to itself. Cross-context flow is allowed ONLY through
# published events (ADR-0011) or a context's query API (ADR-0013) — never by
# reaching into another context's aggregates/tables. The two sanctioned seams
# below are whitelisted explicitly so any *new* cross-context edge fails the
# gate (ADR-0013: an unenforced boundary erodes silently).
[[tool.importlinter.contracts]]
name = "bounded contexts are independent (events/query-API seams only)"
type = "independence"
modules = [
    "books.party",
    "books.invoicing",
    "books.expense_management",
    "books.general_ledger",
    "books.bank_reconciliation",
]
ignore_imports = [
    # ADR-0011: ledger is event-fed; consuming another context's published
    # events is the sanctioned synchronous-integration seam.
    "books.general_ledger.service -> books.invoicing.events",
    "books.general_ledger.service -> books.expense_management.events",
    # ADR-0013: reconciliation reads ledger postings through GL's query API
    # (PostingView), not its tables/aggregates.
    "books.bank_reconciliation.service -> books.general_ledger.service",
]

# Reporting is the read-model leaf (ADR-0007/0010/0014/0016): it may join
# across contexts, but nothing may depend on it. Only the composition root
# wires it.
[[tool.importlinter.contracts]]
name = "reporting is a read-model leaf (nothing depends on it)"
type = "forbidden"
source_modules = [
    "books.platform",
    "books.party",
    "books.invoicing",
    "books.expense_management",
    "books.general_ledger",
    "books.bank_reconciliation",
]
forbidden_modules = ["books.reporting"]

# Reporting reads across contexts ONLY through their service APIs
# (ADR-0013 amendment 2026-05-20): with persistence now a private subpackage
# per context, this contract makes the existing convention enforceable.
# The reporting-leaf contract above only stops things importing reporting;
# it says nothing about what reporting may reach into.
[[tool.importlinter.contracts]]
name = "reporting reads contexts via their service API, not persistence"
type = "forbidden"
source_modules = ["books.reporting"]
forbidden_modules = [
    "books.party.persistence",
    "books.invoicing.persistence",
    "books.expense_management.persistence",
    "books.general_ledger.persistence",
    "books.bank_reconciliation.persistence",
]
# Only flag DIRECT imports of persistence from reporting. The transitive
# chain reporting → <context>.service → <context>.persistence is fine —
# that's the service legitimately using its own persistence on reporting's
# behalf via the query API. What we forbid is reporting reaching into a
# foreign context's persistence itself.
allow_indirect_imports = "True"

# interfaces/ is the outermost adapter leaf: nothing in the domain may
# depend on it (ADR-0013 discipline; web-interface tracer slice).
[[tool.importlinter.contracts]]
name = "interfaces is an outermost leaf (nothing depends on it)"
type = "forbidden"
source_modules = [
    "books.platform",
    "books.party",
    "books.invoicing",
    "books.expense_management",
    "books.general_ledger",
    "books.bank_reconciliation",
    "books.reporting",
]
forbidden_modules = ["books.interfaces"]

# interfaces/ may use the composition root + service APIs, but must never
# reach into a context's private persistence/aggregate modules. Each such
# private module is added here as a forbidden target as the interface grows
# (explicit-deny discipline, analogous to the seam whitelist above).
[[tool.importlinter.contracts]]
name = "interfaces touches only the service seam (no platform plumbing)"
type = "forbidden"
source_modules = ["books.interfaces"]
forbidden_modules = ["books.platform.db", "books.platform.events"]
ignore_imports = [
    # The composition root (books) imports platform plumbing — that is
    # correct by design and governed by the 'platform is plumbing' contract.
    # The transitive path books.interfaces -> books -> books.platform.* is
    # sanctioned; only a *direct* interfaces -> platform edge is prohibited.
    "books.interfaces.web.app -> books",
]

[tool.djlint]
profile = "jinja"
extension = "html"
# Flask default template/static locations
exclude = ".venv,venv,migrations"
# H005/H016/H030/H031: full-document SEO/lang rules (noisy for partials & macros)
# T002/T003: template-syntax rules
ignore = "H005,H016,H030,H031,T002,T003"
